<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /*!
       * base-href fixup for /xxx.html/<route> SPA path form
       * @changelog
       * | 版本   | 变更说明                                                             | 关联                                   |
       * | v1.0.0 | 检测 /xxx.html/ 伪目录段，动态注入 <base href> 修正相对资源解析基准 | REQ: router-hash-path-normalization    |
       * /@changelog
       * @author fancylin
       *
       * 背景：当 vite 构建产物使用 base: './' 输出相对路径（./assets/*.js）时，
       *      访问 http://host/xxx.html/route 形式的 SPA URL，浏览器会把
       *      ./assets/*.js 解析为 http://host/xxx.html/assets/*.js 导致 404。
       * 修复：在 head 首位以同步 <script>（非 module）阻塞式检测 pathname，
       *      命中 /xxx.html/ 段则计算正确目录 URL 并注入 <base href>，
       *      使后续所有静态引用与运行时动态 import 按正确基准解析。
       * 未命中时零副作用（直接 return，不注入 <base>）。
       */
      (function () {
        try {
          var seg = /\/[^/]+\.html\//.exec(location.pathname);
          if (!seg) return;
          var baseDir = location.pathname.substring(0, seg.index + 1);
          var baseHref = location.origin + baseDir;
          var baseEl = document.createElement('base');
          baseEl.setAttribute('href', baseHref);
          document.head.insertBefore(baseEl, document.head.firstChild);
        } catch (e) {
          /* 兜底：任何异常都不阻塞页面加载 */
        }
      })();
    </script>

      content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover"
    />
